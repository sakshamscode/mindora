<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mindora Quick Capture</title>
  <link rel="stylesheet" href="../assets/styles/theme.css">
  <link rel="stylesheet" href="../assets/styles/components.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <img src="../assets/icons/mindora-logo.svg" alt="Mindora" class="brand-logo">
        <span class="brand-title">Mindora</span>
      </div>
      <div class="header-actions">
        <button id="open-library-btn" class="btn btn-subtle btn-sm" title="Open Full Library">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
          Library
        </button>
      </div>
    </header>

    <!-- Duplicate Alert Banner (Hidden by default) -->
    <div id="duplicate-banner" class="duplicate-alert" style="display: none;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>This excerpt is already saved.</span>
    </div>

    <!-- Capture Form -->
    <main class="popup-content">
      <div class="input-group">
        <label class="input-label" for="excerpt-input">
          <span>Excerpt to Capture</span>
          <span id="selection-status-badge" class="selection-indicator">Selection detected</span>
        </label>
        <textarea id="excerpt-input" class="textarea" rows="3" placeholder="Select text on the webpage or paste text here..."></textarea>
      </div>

      <div class="input-group">
        <label class="input-label" for="note-input">Personal Takeaway / Note</label>
        <input type="text" id="note-input" class="input" placeholder="Why is this important? (optional)">
      </div>

      <div class="form-row">
        <!-- Collection Selector -->
        <div class="input-group flex-1">
          <label class="input-label" for="collection-select">Collection</label>
          <div class="collection-select-wrapper">
            <select id="collection-select" class="select">
              <option value="">General (No collection)</option>
            </select>
            <button id="new-collection-btn" class="btn btn-icon btn-sm" title="New Collection">+</button>
          </div>
        </div>

        <!-- Reading Status -->
        <div class="input-group">
          <label class="input-label" for="status-select">Status</label>
          <select id="status-select" class="select">
            <option value="unread" selected>Unread</option>
            <option value="in_progress">In Progress</option>
            <option value="reviewed">Reviewed</option>
            <option value="archived">Archived</option>
          </select>
        </div>
      </div>

      <!-- Tag Input -->
      <div class="input-group">
        <label class="input-label">Tags</label>
        <div class="tags-container" id="tags-container">
          <!-- Active tag chips appear here -->
          <input type="text" id="tag-input" class="tag-inline-input" placeholder="Type tag & Enter...">
        </div>
      </div>

      <!-- Save Button -->
      <button id="save-btn" class="btn btn-primary btn-save">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        Save to Mindora
      </button>

      <!-- Recent Saves Accordion / Preview -->
      <section class="recent-section">
        <div class="recent-header">
          <span class="recent-title">Recent Captures</span>
          <span id="recent-count" class="recent-count">0 items</span>
        </div>
        <div id="recent-list" class="recent-list">
          <div class="recent-empty">No recent items yet. Select text on any webpage and save!</div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="popup-footer">
      <span class="shortcut-tip"><kbd>Alt</kbd>+<kbd>S</kbd> quick capture selection</span>
      <button id="footer-library-btn" class="footer-link">Go to Library &rarr;</button>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
