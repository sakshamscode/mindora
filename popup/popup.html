<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mindora Quick Capture</title>
  <link rel="stylesheet" href="../assets/styles/theme.css">
  <link rel="stylesheet" href="../assets/styles/components.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <img src="../assets/icons/mindora-logo.svg" alt="Mindora" class="brand-logo">
        <span class="brand-title" data-i18n="appName">Mindora</span>
      </div>
      <div class="header-actions">
        <!-- Quick Language Switcher -->
        <select id="popup-lang-select" class="select select-sm lang-picker" title="Switch Language">
          <!-- Populated from SUPPORTED_LANGUAGES -->
        </select>
        <button id="open-library-btn" class="btn btn-subtle btn-sm" title="Open Full Library" data-i18n-title="open_library">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
          <span data-i18n="open_library">Library</span>
        </button>
      </div>
    </header>

    <!-- Duplicate Alert Banner (Hidden by default) -->
    <div id="duplicate-banner" class="duplicate-alert" style="display: none;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span data-i18n="already_saved_alert">This excerpt is already saved.</span>
    </div>

    <!-- Capture Form -->
    <main class="popup-content">
      <!-- Excerpt Input & Translation Bar -->
      <div class="input-group">
        <div class="input-label-row">
          <label class="input-label" for="excerpt-input" data-i18n="excerpt_to_capture">Excerpt to Capture</label>
          <div class="excerpt-controls">
            <span id="selection-status-badge" class="selection-indicator" data-i18n="selection_detected">Selection detected</span>
            <button type="button" id="toggle-translate-btn" class="btn-text-action" title="Translate this excerpt">
              <span class="action-icon">🌐</span>
              <span id="translate-toggle-label" data-i18n="translate_excerpt">Translate excerpt</span>
            </button>
          </div>
        </div>

        <textarea id="excerpt-input" class="textarea" rows="3" placeholder="Select text on the webpage or paste text here..." data-i18n-placeholder="excerpt_placeholder"></textarea>

        <!-- Dynamic Live Translation Panel (Collapsible) -->
        <div id="translation-panel" class="translation-panel" style="display: none;">
          <div class="trans-panel-header">
            <div class="trans-lang-select-group">
              <span class="trans-label" data-i18n="target_lang">Target:</span>
              <select id="target-lang-select" class="select select-sm trans-lang-select">
                <!-- Dynamically populated -->
              </select>
            </div>
            <span id="detected-lang-badge" class="detected-badge">Auto</span>
          </div>
          <div class="trans-output-box">
            <textarea id="translated-output" class="textarea trans-textarea" rows="2" placeholder="Translation will appear here..."></textarea>
            <div id="trans-loading-indicator" class="trans-loader" style="display: none;">
              <span class="spinner"></span> <span data-i18n="translating">Translating...</span>
            </div>
          </div>
        </div>
      </div>

      <div class="input-group">
        <label class="input-label" for="note-input" data-i18n="personal_takeaway">Personal Takeaway / Note</label>
        <input type="text" id="note-input" class="input" placeholder="Why is this important? (optional)" data-i18n-placeholder="takeaway_placeholder">
      </div>

      <div class="form-row">
        <!-- Collection Selector -->
        <div class="input-group flex-1">
          <label class="input-label" for="collection-select" data-i18n="collection">Collection</label>
          <div class="collection-select-wrapper">
            <select id="collection-select" class="select">
              <option value="" data-i18n="general_collection">General (No collection)</option>
            </select>
            <button id="new-collection-btn" class="btn btn-icon btn-sm" title="New Collection">+</button>
          </div>
        </div>

        <!-- Reading Status -->
        <div class="input-group">
          <label class="input-label" for="status-select" data-i18n="status">Status</label>
          <select id="status-select" class="select">
            <option value="unread" selected data-i18n="unread">Unread</option>
            <option value="in_progress" data-i18n="in_progress">In Progress</option>
            <option value="reviewed" data-i18n="reviewed">Reviewed</option>
            <option value="archived" data-i18n="archived">Archived</option>
          </select>
        </div>
      </div>

      <!-- Tag Input -->
      <div class="input-group">
        <label class="input-label" data-i18n="tags">Tags</label>
        <div class="tags-container" id="tags-container">
          <input type="text" id="tag-input" class="tag-inline-input" placeholder="Type tag & Enter..." data-i18n-placeholder="type_tag_hint">
        </div>
      </div>

      <!-- Save Button -->
      <button id="save-btn" class="btn btn-primary btn-save">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        <span id="save-btn-text" data-i18n="save_to_mindora">Save to Mindora</span>
      </button>

      <!-- Recent Saves Preview -->
      <section class="recent-section">
        <div class="recent-header">
          <span class="recent-title" data-i18n="recent_captures">Recent Captures</span>
          <span id="recent-count" class="recent-count">0 items</span>
        </div>
        <div id="recent-list" class="recent-list">
          <div class="recent-empty" data-i18n="no_recent_items">No recent items yet. Select text on any webpage and save!</div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="popup-footer">
      <span class="shortcut-tip"><kbd>Alt</kbd>+<kbd>S</kbd> <span data-i18n="shortcut_hint">quick capture selection</span></span>
      <button id="footer-library-btn" class="footer-link" data-i18n="go_to_library">Go to Library &rarr;</button>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
